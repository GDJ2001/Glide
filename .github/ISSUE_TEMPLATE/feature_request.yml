name: Feature Request
description: Suggest an idea or enhancement for Glide
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting a new feature for Glide? Please ensure it aligns with our core mission: offline, peer-to-peer, zero-cloud file transfer.
  - type: dropdown
    id: platform
    attributes:
      label: Target Platform
      options:
        - All / Core Protocol
        - Android
        - Windows
        - Linux
        - Apple (macOS / iOS)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
