name: Apple development build

on:
  push:
    branches:
      - fix/native-completion-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select and record Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Compile GlideCoreKit
        run: swift build --package-path apple/GlideCoreKit

      - name: Compile iOS simulator application
        run: xcodebuild build -project apple/GlideApple.xcodeproj -scheme GlideIOS -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build/apple-compile CODE_SIGNING_ALLOWED=NO

      - name: Check embedded Share Extension bundle
        run: |
          test -d build/apple-compile/Build/Products/Release-iphonesimulator/GlideIOS.app/PlugIns/GlideShareExtension.appex
          plutil -lint build/apple-compile/Build/Products/Release-iphonesimulator/GlideIOS.app/PlugIns/GlideShareExtension.appex/Info.plist

      - name: Compile macOS application
        run: xcodebuild build -project apple/GlideApple.xcodeproj -scheme GlideMac -configuration Release -derivedDataPath build/apple-compile CODE_SIGNING_ALLOWED=NO
