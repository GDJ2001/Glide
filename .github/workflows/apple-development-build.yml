name: Apple development build

on:
  push:
    branches:
      - fix/native-completion-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select and record Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run Apple backend tests and validation
        run: |
          chmod +x apple/scripts/run-backend-tests.sh
          ./apple/scripts/run-backend-tests.sh

      - name: Archive Apple backend test evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: apple-backend-test-evidence
          path: build/test-evidence/apple-backend/
          retention-days: 14
