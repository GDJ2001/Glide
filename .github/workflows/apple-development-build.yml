name: Apple development build

on:
  push:
    branches:
      - fix/native-completion-hardening
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select and record Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run Apple backend tests and validation
        run: |
          chmod +x apple/scripts/run-backend-tests.sh
          ./apple/scripts/run-backend-tests.sh

      - name: Install and uninstall macOS development package
        run: |
          package=$(find build/distributions/runs -name Glide-macos-development-unsigned.pkg -print -quit)
          test -n "$package"
          sudo /usr/sbin/installer -pkg "$package" -target /
          pkgutil --files dev.glide.mac.installer | sed -n '1,12p'
          ls -ld /Applications/Glide.app '/Applications/Glide Uninstaller.app'
          test -d /Applications/Glide.app
          test -d '/Applications/Glide Uninstaller.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/Glide.app/Contents/Info.plist)" = dev.glide.mac
          sudo /bin/bash '/Applications/Glide Uninstaller.app/Contents/Resources/uninstall.sh'
          test ! -e /Applications/Glide.app
          test ! -e '/Applications/Glide Uninstaller.app'
          if pkgutil --pkg-info dev.glide.mac.installer >/dev/null 2>&1; then
            echo 'Glide package receipt remained after uninstall.' >&2
            exit 1
          fi

      - name: Archive Apple backend test evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: apple-backend-test-evidence
          path: build/test-evidence/apple-backend/
          retention-days: 14

      - name: Archive Apple development packages
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: apple-packages-${{ github.sha }}
          path: build/distributions/runs/*/apple/
          if-no-files-found: error
          retention-days: 14
