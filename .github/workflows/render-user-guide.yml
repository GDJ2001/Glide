name: Render Glide user guide screenshots

on:
  push:
    branches:
      - docs/glide-v1-bilingual-visual-guides
    paths:
      - 'doc/user-guide/assets/*.svg'
      - 'tools/generate-user-guide-assets.py'
      - '.github/workflows/render-user-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render real screenshot-based annotated PNGs
        run: python tools/generate-user-guide-assets.py
      - name: Check generated asset count
        run: |
          test "$(find doc/user-guide/assets -maxdepth 1 -name '*_annotated.png' | wc -l)" -eq 7
      - name: Commit PNG screenshots to documentation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/user-guide/assets/*_annotated.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(guide): render seven source-backed annotated PNGs"
            git push
          fi
