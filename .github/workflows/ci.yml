name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'hardening/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build, Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check Documentation & Link Integrity
        run: ./gradlew checkDocumentation

      - name: Enforce Architecture and Static Analysis
        run: ./gradlew checkArchitecture

      - name: Assemble Debug APK
        run: ./gradlew :android:app:assembleDebug

      - name: Compile HARD-003 JVM regression sources
        run: ./gradlew :android:app:compileDebugUnitTestKotlin :android:transport-lan:compileDebugUnitTestKotlin

      - name: Run Behavioral LAN and Protocol Gates
        run: ./gradlew checkLanGate

      - name: Run ordinary unit tests
        run: ./gradlew test

      - name: Run Android Lint
        run: ./gradlew :android:app:lintDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: android-verification-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/core/build/reports/
            android/transport-lan/build/reports/
            android/transport-lan/build/test-results/
            android/designsystem/build/reports/
            android/transport-nearby/build/reports/
            android/data/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  dotnet-linux:
    name: .NET Shared + Linux GUI and Packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            runtime: linux-x64
          - runner: ubuntu-24.04-arm
            runtime: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build cross-platform .NET tests and dependencies
        run: dotnet build desktop/tests/Glide.Tests/Glide.Tests.csproj -c Release

      - name: Build Avalonia Linux GUI
        run: dotnet build desktop/linux/Glide.Linux.UI/Glide.Linux.UI.csproj -c Release

      - name: Run ordinary .NET tests
        run: dotnet test desktop/tests/Glide.Tests/Glide.Tests.csproj -c Release --no-build --filter "HARD!=003-red" --logger "trx;LogFileName=ordinary-linux.trx"

      - name: Install native RPM packaging tool
        run: sudo apt-get update && sudo apt-get install -y rpm cpio

      - name: Build native Linux packages
        run: bash tools/package-linux-native.sh '${{ matrix.runtime }}'

      - name: Upload Linux package and .NET reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: linux-dotnet-verification-${{ matrix.runtime }}
          path: |
            build/distributions/runs/*/linux/*.tar.gz
            build/distributions/runs/*/linux/*.deb
            build/distributions/runs/*/linux/*.rpm
            build/distributions/runs/*/linux/BUILD-MANIFEST.txt
            build/distributions/runs/*/linux/SHA256SUMS-*.txt
            desktop/tests/Glide.Tests/TestResults/
          if-no-files-found: error
          retention-days: 14

  apple-build:
    name: Apple Swift, iOS and macOS development packages
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select pinned Xcode 26.6 and record toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          mkdir -p build/ci-toolchains
          xcodebuild -version | tee build/ci-toolchains/xcode-version.txt
          swift --version | tee build/ci-toolchains/swift-version.txt
          grep -q 'Xcode 26.6' build/ci-toolchains/xcode-version.txt

      - name: Build GlideCoreKit
        run: swift build --package-path apple/GlideCoreKit

      - name: Package unsigned macOS app
        run: bash apple/scripts/package-macos.sh

      - name: Package unsigned iOS simulator and device archive
        run: bash apple/scripts/package-ios.sh

      - name: Upload Apple toolchain and unsigned build products
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: apple-unsigned-development
          path: |
            build/ci-toolchains/xcode-version.txt
            build/ci-toolchains/swift-version.txt
            build/distributions/runs/*/apple/macos/*.zip
            build/distributions/runs/*/apple/macos/BUILD-MANIFEST.txt
            build/distributions/runs/*/apple/macos/SHA256SUMS.txt
            build/distributions/runs/*/apple/ios/*.zip
            build/distributions/runs/*/apple/ios/BUILD-MANIFEST.txt
            build/distributions/runs/*/apple/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  dotnet-windows:
    name: Windows .NET Build & Test
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build full Windows solution
        run: dotnet build desktop/Glide.slnx -c Release

      - name: Run all .NET tests on Windows
        run: dotnet test desktop/Glide.slnx -c Release --no-build --logger "trx;LogFileName=windows.trx"

      - name: Build self-contained Windows portable artifact
        shell: pwsh
        run: ./desktop/windows/package-windows.ps1 -Configuration Release -Version 0.0.0-ci -SkipInstaller

      - name: Upload Windows test reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-dotnet-verification
          path: desktop/tests/Glide.Tests/TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows portable artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: glide-windows-portable
          path: build/distributions/windows/glide-windows-win-x64.zip
          if-no-files-found: error
          retention-days: 14
