name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'hardening/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build, Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check Documentation & Link Integrity
        run: ./gradlew checkDocumentation

      - name: Enforce Architecture and Static Analysis
        run: ./gradlew checkArchitecture

      - name: Assemble Debug APK
        run: ./gradlew :android:app:assembleDebug

      - name: Compile HARD-003 JVM regression sources
        run: ./gradlew :android:app:compileDebugUnitTestKotlin :android:transport-lan:compileDebugUnitTestKotlin

      - name: Run Behavioral LAN and Protocol Gates
        run: ./gradlew checkLanGate

      - name: Run ordinary unit tests
        run: ./gradlew test

      - name: Run Android Lint
        run: ./gradlew :android:app:lintDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: android-verification-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/core/build/reports/
            android/transport-lan/build/reports/
            android/transport-lan/build/test-results/
            android/designsystem/build/reports/
            android/transport-nearby/build/reports/
            android/data/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  dotnet-linux:
    name: .NET Shared + Linux Package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build cross-platform .NET tests and dependencies
        run: dotnet build desktop/tests/Glide.Tests/Glide.Tests.csproj -c Release

      - name: Run ordinary .NET tests
        run: dotnet test desktop/tests/Glide.Tests/Glide.Tests.csproj -c Release --no-build --filter "HARD!=003-red" --logger "trx;LogFileName=ordinary-linux.trx"

      - name: Build Linux self-contained package
        shell: pwsh
        run: ./desktop/linux/build-linux-packages.ps1 -Configuration Release -Runtimes linux-x64

      - name: Upload Linux package and .NET reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: linux-dotnet-verification
          path: |
            build/distributions/linux/*.tar.gz
            desktop/tests/Glide.Tests/TestResults/
          if-no-files-found: ignore
          retention-days: 14

  dotnet-windows:
    name: Windows .NET Build & Test
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build full Windows solution
        run: dotnet build desktop/Glide.slnx -c Release

      - name: Run ordinary .NET tests on Windows
        run: dotnet test desktop/tests/Glide.Tests/Glide.Tests.csproj -c Release --no-build --filter "HARD!=003-red" --logger "trx;LogFileName=ordinary-windows.trx"

      - name: Upload Windows test reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-dotnet-verification
          path: desktop/tests/Glide.Tests/TestResults/
          if-no-files-found: ignore
          retention-days: 14
